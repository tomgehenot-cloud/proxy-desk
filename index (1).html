const FALLBACK={schema:2,version:'3.2',verified:'2026-10-19',source:'https://zenless.hoyoverse.com/en-us/news/cate/',events:[],rotations:[]};
const DEFAULT={level:30,member:false,spoilers:true,hideOptional:true,unlocked:{ridu:true,hollow:false,hunt:false,bangboo:true,shiyu:false,assault:false,simul:false},disabled:[],feedUrl:(location.protocol==='https:'?new URL('feed/events.json',location.href).href:''),autoRefresh:true,notify:false,notifyDays:2,rotationDates:{shiyu:'',assault:'',simul:''}};
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('px2_'+k))??f}catch{return f}};const save=(k,v)=>{try{localStorage.setItem('px2_'+k,JSON.stringify(v))}catch{}};
let profile={...DEFAULT,...read('profile',{})};profile.unlocked={...DEFAULT.unlocked,...profile.unlocked};profile.rotationDates={...DEFAULT.rotationDates,...profile.rotationDates};let progress=read('progress',{}),eventsProgress=read('eventsProgress',{}),feed=read('feed',FALLBACK),meta=read('meta',{lastAttempt:null,lastSuccess:null,error:null}),page='home',eventFilter='active';
// Boundaries follow Europe server time UTC+1; do not follow local daylight saving time.
function period(group,at=Date.now()){const d=new Date(at+3600000-4*3600000);let y=d.getUTCFullYear(),m=d.getUTCMonth(),date=d.getUTCDate(),dow=d.getUTCDay();if(group==='daily')return `${y}-${String(m+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;if(group==='weekly'){let x=new Date(Date.UTC(y,m,date-((dow+6)%7)));return x.toISOString().slice(0,10)}if(group==='monthly')return `${y}-${String(m+1).padStart(2,'0')}`;return 'fixed'}
function nextReset(group,at=Date.now()){const shifted=new Date(at-3*3600000);let y=shifted.getUTCFullYear(),m=shifted.getUTCMonth(),d=shifted.getUTCDate();if(group==='daily')return Date.UTC(y,m,d+1,3);if(group==='weekly'){let wd=shifted.getUTCDay(),offset=(8-wd)%7||7;return Date.UTC(y,m,d+offset,3)}return Date.UTC(y,m+1,1,3)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=ms=>new Intl.DateTimeFormat('fr-BE',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Brussels'}).format(ms);const stamp=ms=>{if(!Number.isFinite(ms))return 'Non renseignée';const t=ms-Date.now();if(t<=0)return 'Terminé';const d=Math.ceil(t/DAY);return d===1?'Moins de 24 h':`J−${d}`};function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.add('hidden'),4300)}
function isUnlocked(t){return t.unlock==='member'?profile.member:!t.unlock||!!profile.unlocked[t.unlock]};function visible(t){return isUnlocked(t)&&!profile.disabled.includes(t.id)&&(!profile.hideOptional||!t.optional)}
function rotationEnd(id){let specific=feed.rotations?.find(x=>x.id===id);let v=specific?.end||profile.rotationDates[id.replace('r-','')];let t=Date.parse(v||'');return Number.isFinite(t)?t:null}
function value(t){let key=(t.group==='rotations'?String(rotationEnd(t.id)||'not-set'):period(t.group));return Math.min(t.goal,Math.max(0,Number(progress[t.id+'|'+key]||0)))}function change(t,delta){let key=t.group==='rotations'?String(rotationEnd(t.id)||'not-set'):period(t.group),k=t.id+'|'+key;progress[k]=Math.max(0,Math.min(t.goal,value(t)+delta));save('progress',progress);render()}
function validEvent(e){if(!e||typeof e.id!=='string'||typeof e.title!=='string'||!Number.isFinite(Date.parse(e.end))||e.url&&!/^https:\/\//.test(e.url))return false;return true}function validate(f){if(!f||f.schema!==2||typeof f.version!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(f.verified)||!Array.isArray(f.events)||f.events.length>160||!f.events.every(validEvent)||!Array.isArray(f.rotations)||f.rotations.length>15)throw Error('Format de flux V2 invalide');for(let r of f.rotations)if(!r.id||!Number.isFinite(Date.parse(r.end)))throw Error('Date de rotation invalide');return f}
function activeEvents(){return feed.events.filter(e=>Date.parse(e.end)>Date.now()&&(!profile.spoilers||!e.spoiler)&&(!e.level||profile.level>=e.level))}function urgency(){return activeEvents().filter(e=>!e.start||Date.parse(e.start)<=Date.now()).filter(e=>Date.parse(e.end)-Date.now()<profile.notifyDays*DAY).sort((a,b)=>Date.parse(a.end)-Date.parse(b.end))}function rewardsRemaining(){let n=0,uncertain=false;for(let e of activeEvents()){if(e.rewardPolychromes===undefined){uncertain=true;continue}let st=eventsProgress[e.id]||{};if(!st.claimed)n+=e.rewardPolychromes}return {n,uncertain}}
function lineTask(t){let n=value(t),ok=n>=t.goal,unit=t.unit||'fois';return `<div class="task"><div><strong>${esc(t.title)}</strong> ${ok?'<span class="tag">Terminé</span>':''}<p>${esc(t.where)}</p><details><summary>Comment faire / quand c’est terminé</summary><p>${esc(t.how)}</p></details>${t.reward?`<small>Récompense suivie : ${t.reward} ${esc(t.rewardUnit)}</small>`:''}</div><div class="counter"><button class="btn slim" data-minus="${t.id}" aria-label="Réduire ${esc(t.title)}">−</button><b>${n}/${t.goal}</b><button class="btn slim" data-plus="${t.id}" aria-label="Augmenter ${esc(t.title)}">+</button></div></div>`}
function groupPanel(group,limit){let tasks=TASKS.filter(t=>t.group===group&&visible(t)).sort((a,b)=>a.priority-b.priority);if(limit)tasks=tasks.filter(t=>value(t)<t.goal).slice(0,limit);let done=TASKS.filter(t=>t.group===group&&visible(t)&&value(t)>=t.goal).length;return `<section class="panel"><div class="flex"><h3>${({daily:'Quotidien',weekly:'Hebdomadaire',monthly:'Mensuel',rotations:'Rotations'})[group]}</h3><span class="small">${done}/${TASKS.filter(t=>t.group===group&&visible(t)).length}</span></div>${group==='rotations'?'<p class="small">Les dates sont saisies dans « Mon compte » ou fournies par un flux vérifié. Pas de fausse rotation inventée.</p>':''}${tasks.map(lineTask).join('')||'<div class="empty">Rien à faire dans cette catégorie.</div>'}</section>`}
function eventLine(e){let st=eventsProgress[e.id]||{},end=Date.parse(e.end),pct=e.rewardPolychromes;return `<div class="event"><div><div class="flex"><strong>${esc(e.title)}</strong><span class="${end-Date.now()<DAY?'bad':'orange'}">${stamp(end)}</span></div><p>Fin : ${fmt(end)} · ${e.level?'Inter-nœud '+e.level+' minimum · ':''}${pct!==undefined?pct+' Polychromes':'Récompenses à vérifier'}${e.spoiler?' · ⚠ risque de spoiler':''}</p>${e.description?`<p>${esc(e.description)}</p>`:''}<div class="links">${e.url?`<a target="_blank" rel="noopener" href="${esc(e.url)}">Annonce source ↗</a>`:''}</div></div><div class="counter"><button class="btn slim ${st.started?'primary':''}" data-ev="${esc(e.id)}" data-field="started">${st.started?'Commencé ✓':'Commencer'}</button><button class="btn slim ${st.claimed?'primary':''}" data-ev="${esc(e.id)}" data-field="claimed">${st.claimed?'Réclamé ✓':'Récompenses'}</button></div></div>`}
function freshness(){let age=Math.floor((Date.now()-Date.parse(feed.verified+'T00:00:00Z'))/DAY);return `<div class="${age>3?'warn':'info'}">Données événements : version ${esc(feed.version)}, vérification éditoriale du ${esc(feed.verified)}. ${age>3?'Anciennes : ne considère pas cette liste comme exhaustive.':'Les données peuvent avoir changé depuis la vérification.'} ${meta.error?`<br>Dernier essai automatique : ${esc(meta.error)}`:''}</div>`}
function today(){let d=TASKS.filter(t=>t.group==='daily'&&visible(t)),done=d.filter(t=>value(t)>=t.goal).length,w=TASKS.filter(t=>t.group==='weekly'&&visible(t)),wd=w.filter(t=>value(t)>=t.goal).length,ur=urgency(),remain=rewardsRemaining();return `<div class="flex headrow"><div><span class="eyebrow">Vue opérationnelle</span><h2>Bonjour, Proxy.</h2><div class="small">Niveau ${profile.level} · Soldat 0 – Anby / Rina / Nicole</div></div><button class="btn" data-page="profile">⚙ Déblocages</button></div><div class="stats"><div class="metric"><span class="small">Aujourd’hui</span><b>${done}/${d.length}</b><div class="progress"><span style="width:${d.length?100*done/d.length:0}%"></span></div></div><div class="metric"><span class="small">Semaine</span><b>${wd}/${w.length}</b><div class="progress"><span style="width:${w.length?100*wd/w.length:0}%"></span></div></div><div class="metric"><span class="small">Urgences vérifiées</span><b>${ur.length}</b><small>dans les ${profile.notifyDays} prochains jours</small></div><div class="metric"><span class="small">Polychromes événements</span><b>${remain.n}</b><small>${remain.uncertain?'Minimum connu · estimation incomplète':'Restants dans le flux chargé'}</small></div></div>${freshness()}<div class="grid2"><div>${groupPanel('daily',0)}${groupPanel('weekly',3)}</div><div><section class="panel urgent"><div class="flex"><h3>⚡ À ne pas manquer</h3><button class="btn slim" data-page="events">Tout voir ↗</button></div>${ur.length?ur.map(eventLine).join(''):'<div class="empty">Aucune échéance urgente connue. Cela ne prouve pas qu’il n’existe aucun événement.</div>'}</section><section class="panel"><h3>Prochains resets</h3>${['daily','weekly','monthly'].map(g=>`<p><b>${({daily:'Quotidien',weekly:'Semaine',monthly:'Mois'})[g]}</b> · ${fmt(nextReset(g))}</p>`).join('')}<p class="small">Heure de reset basée sur le serveur Europe (UTC+1 fixe), affichage des dates dans ton fuseau local.</p></section><section class="panel"><h3>Sources rapides</h3><div class="links"><a target="_blank" rel="noopener" href="https://zenless.hoyoverse.com/en-us/news/cate/">Actualités HoYoverse ↗</a><a target="_blank" rel="noopener" href="https://dailyreset.games/games/zenless-zone-zero/checklist/">Référence routines ↗</a></div></section></div></div>`}
function rotationPage(){let a=TASKS.filter(t=>t.group==='rotations');return `<span class="eyebrow">Cycles indépendants</span><h2>Rotations exactes</h2><p class="small">Les dates exactes sont fournies par le flux si disponibles ; sinon saisis la fin indiquée dans le jeu. Sans date, le site ne prétend pas connaître la rotation.</p><div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">${a.map(t=>{let end=rotationEnd(t.id);return `<div class="metric"><span class="small">${esc(t.title)}</span><b style="font-size:19px">${stamp(end)}</b><small>${end?fmt(end):'Date non renseignée'}</small></div>`}).join('')}</div>${groupPanel('rotations')}`}
function eventPage(){let items=feed.events.filter(e=>eventFilter==='all'||eventFilter==='active'&&Date.parse(e.end)>Date.now()||eventFilter==='urgent'&&urgency().some(x=>x.id===e.id));items=items.filter(e=>!(profile.spoilers&&e.spoiler)&&(!e.level||profile.level>=e.level));items.sort((a,b)=>Date.parse(a.end)-Date.parse(b.end));return `<div class="flex"><div><span class="eyebrow">Données vérifiées ou importées</span><h2>Événements</h2></div><button class="btn" data-page="settings">Configurer l’actualisation</button></div>${freshness()}<div class="pills">${[['active','En cours'],['urgent','Urgents'],['all','Tous']].map(([k,n])=>`<button class="${eventFilter===k?'on':''}" data-filter="${k}">${n}</button>`).join('')}</div><section class="panel" style="margin-top:14px">${items.map(eventLine).join('')||'<div class="empty">Aucun événement vérifié pour ce filtre. Consulte les annonces officielles : absence de données ≠ absence d’événement.</div>'}</section>`}
function profilePage(){return `<span class="eyebrow">Ton compte</span><h2>Déblocages et routine</h2><p class="small">Seuls les modes activés apparaîtront dans tes listes. Mets-les à jour à mesure que tu progresses dans le jeu.</p><section class="panel"><div class="formgrid"><label class="field">Niveau Inter-nœud<input id="level" type="number" min="1" max="99" value="${profile.level}"></label><label class="field">Abonnement Inter-nœud<select id="member"><option value="0" ${!profile.member?'selected':''}>Inactif</option><option value="1" ${profile.member?'selected':''}>Actif</option></select></label></div><h3 style="margin-top:18px">Modes débloqués</h3>${[['ridu','Ridu hebdo'],['hollow','Néant Zéro'],['hunt','Chasse notoire'],['bangboo','Bangbous'],['shiyu','Nœud critique de Shiyu'],['assault','Assaut mortel'],['simul','Simulacre d’annihilation']].map(([k,n])=>`<label class="toggle"><input type="checkbox" data-unlock="${k}" ${profile.unlocked[k]?'checked':''}>${n}</label>`).join('')}<h3 style="margin-top:18px">Préférences</h3><label class="toggle"><input type="checkbox" id="spoilers" ${profile.spoilers?'checked':''}>Masquer les événements signalés comme spoilers</label><label class="toggle"><input type="checkbox" id="optional" ${profile.hideOptional?'checked':''}>Masquer les tâches facultatives</label><p><button class="btn primary" id="saveProfile">Enregistrer mon profil</button></p></section><section class="panel"><h3>Dates de fin des rotations (si le flux n’en dispose pas)</h3><p class="small">Saisis l’heure affichée en jeu, en heure locale. Si le flux contient une échéance vérifiée, elle est prioritaire.</p><div class="formgrid">${[['shiyu','Shiyu'],['assault','Assaut mortel'],['simul','Simulacre']].map(([k,n])=>`<label class="field">${n}<input type="datetime-local" data-rotation-date="${k}" value="${profile.rotationDates[k]||''}"></label>`).join('')}</div><p><button class="btn" id="saveRotations">Enregistrer les échéances</button></p></section><section class="panel"><h3>Masquer des tâches individuellement</h3>${TASKS.map(t=>`<label class="toggle"><input type="checkbox" data-disable="${t.id}" ${profile.disabled.includes(t.id)?'checked':''}>${esc(t.title)}</label>`).join('')}<p><button class="btn" id="saveDisabled">Enregistrer les exclusions</button></p></section>`}
function settingsPage(){return `<span class="eyebrow">Mises à jour et sécurité</span><h2>Réglages</h2>${freshness()}<section class="panel"><h3>Actualisation automatique</h3><p class="small">Pour un vrai flux automatique, il faut héberger un JSON V2 alimenté par une veille fiable (non disponible dans le simple fichier local). Le site le recharge à l’ouverture et lorsqu’il est ouvert, si une URL est configurée et que CORS l’autorise. Aucune date nouvelle n’est inventée.</p><label class="field">URL publique du flux JSON<input id="feedUrl" type="url" placeholder="https://exemple.fr/zzz-events.json" value="${esc(profile.feedUrl)}"></label><label class="toggle"><input type="checkbox" id="autoRefresh" ${profile.autoRefresh?'checked':''}>Actualiser automatiquement à l’ouverture</label><div class="flex"><button class="btn primary" id="saveFeed">Enregistrer</button><button class="btn" id="checkFeed">Vérifier maintenant</button><button class="btn" id="importFeed">Importer fichier JSON</button><input class="hidden" id="feedFile" type="file" accept="application/json,.json"></div><p class="small">Dernier succès : ${meta.lastSuccess?fmt(Date.parse(meta.lastSuccess)):'Aucun'} · ${meta.error?'Dernière erreur : '+esc(meta.error):'Aucune erreur récente'}</p></section><section class="panel"><h3>Notifications</h3><p class="small">Alertes dans le tableau de bord et, si autorisé, notifications du navigateur tant que la page reste ouverte. Pas de push garanti lorsque le site est fermé.</p><label class="toggle"><input type="checkbox" id="notify" ${profile.notify?'checked':''}>Activer les notifications du navigateur</label><label class="field">Avertir combien de jours avant l’expiration ?<select id="notifyDays">${[1,2,3,7].map(n=>`<option value="${n}" ${profile.notifyDays===n?'selected':''}>${n} jour${n>1?'s':''}</option>`).join('')}</select></label><p><button class="btn" id="saveNotify">Enregistrer les alertes</button></p></section><section class="panel"><h3>Sauvegarde et migration</h3><p class="small">Les données de la V1 sont préservées dans le navigateur ; cette V2 conserve ses propres clés. Tu peux sauvegarder la V2 ou essayer une récupération des cases compatibles de la V1.</p><div class="flex"><button class="btn" id="export">Exporter sauvegarde</button><button class="btn" id="import">Importer sauvegarde</button><button class="btn" id="migrate">Récupérer cases V1</button><button class="btn" id="sample">Modèle de flux V2</button><input class="hidden" type="file" id="backupFile" accept=".json,application/json"></div></section><section class="panel"><h3>Sources à consulter</h3><div class="links"><a href="https://zenless.hoyoverse.com/en-us/news/cate/" target="_blank" rel="noopener">HoYoverse officiel</a><a href="https://dailyreset.games/games/zenless-zone-zero/checklist/" target="_blank" rel="noopener">Checklist communautaire</a></div></section>`}
function render(){document.getElementById('nav').innerHTML=NAV.map(([id,n])=>`<button class="${page===id?'sel':''}" data-page="${id}">${n}</button>`).join('');document.getElementById('app').innerHTML=page==='home'?today():page==='daily'||page==='weekly'||page==='monthly'?`<span class="eyebrow">Routine renouvelable</span><h2>${{daily:'Tous les jours',weekly:'Chaque semaine',monthly:'Chaque mois'}[page]}</h2><p class="small">Prochain reset : ${fmt(nextReset(page))} · Compteurs sauvegardés pour la période.</p>${groupPanel(page)}`:page==='rotations'?rotationPage():page==='events'?eventPage():page==='profile'?profilePage():settingsPage();document.getElementById('clock').textContent='Europe · '+new Intl.DateTimeFormat('fr-BE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Brussels'}).format(new Date());bind()}
function download(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function fileJSON(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){toast('Erreur import : '+e.message)}};r.readAsText(file)}
async function fetchFeed(){meta.lastAttempt=new Date().toISOString();if(!profile.feedUrl){meta.error='Aucune URL de flux configurée';save('meta',meta);render();return}try{if(!/^https:\/\//.test(profile.feedUrl))throw Error('Une URL HTTPS est nécessaire');let r=await fetch(profile.feedUrl,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let next=validate(await r.json());feed=next;meta.error=null;meta.lastSuccess=new Date().toISOString();save('feed',feed);save('meta',meta);toast('Flux actualisé — '+feed.version)}catch(e){meta.error=e.message;save('meta',meta);toast('Flux non disponible : '+e.message)}render()}
function notifyCheck(){if(!profile.notify||typeof Notification==='undefined'||Notification.permission!=='granted')return;let ids=urgency().filter(e=>!(eventsProgress[e.id]||{}).claimed).map(e=>e.id);let sig=ids.join(',')+'|'+period('daily');if(ids.length&&read('notificationSignature','')!==sig){new Notification('Proxy Desk — Récompenses urgentes',{body:`${ids.length} événement(s) arrivent à expiration. Ouvre le tableau de bord.`});save('notificationSignature',sig)}}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();scrollTo(0,0)});document.querySelectorAll('[data-plus],[data-minus]').forEach(b=>b.onclick=()=>{let t=TASKS.find(x=>x.id===(b.dataset.plus||b.dataset.minus));change(t,b.hasAttribute('data-plus')?(t.step||1):-(t.step||1))});document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{let k=b.dataset.ev,field=b.dataset.field;eventsProgress[k]={...eventsProgress[k],[field]:!(eventsProgress[k]||{})[field]};save('eventsProgress',eventsProgress);render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{eventFilter=b.dataset.filter;render()});let by=id=>document.getElementById(id);if(by('saveProfile'))by('saveProfile').onclick=()=>{profile.level=Number(by('level').value)||30;profile.member=by('member').value==='1';profile.spoilers=by('spoilers').checked;profile.hideOptional=by('optional').checked;document.querySelectorAll('[data-unlock]').forEach(el=>profile.unlocked[el.dataset.unlock]=el.checked);save('profile',profile);toast('Profil enregistré');render()};if(by('saveDisabled'))by('saveDisabled').onclick=()=>{profile.disabled=[...document.querySelectorAll('[data-disable]:checked')].map(x=>x.dataset.disable);save('profile',profile);toast('Tâches masquées mises à jour');render()};if(by('saveRotations'))by('saveRotations').onclick=()=>{document.querySelectorAll('[data-rotation-date]').forEach(el=>profile.rotationDates[el.dataset.rotationDate]=el.value?new Date(el.value).toISOString():'');save('profile',profile);toast('Dates enregistrées');render()};if(by('saveFeed'))by('saveFeed').onclick=()=>{profile.feedUrl=by('feedUrl').value.trim();profile.autoRefresh=by('autoRefresh').checked;save('profile',profile);toast('Configuration du flux enregistrée')};if(by('checkFeed'))by('checkFeed').onclick=fetchFeed;if(by('importFeed'))by('importFeed').onclick=()=>by('feedFile').click();if(by('feedFile'))by('feedFile').onchange=()=>fileJSON(by('feedFile').files[0],v=>{feed=validate(v);save('feed',feed);toast('Données importées');render()});if(by('saveNotify'))by('saveNotify').onclick=async()=>{profile.notify=by('notify').checked;profile.notifyDays=Number(by('notifyDays').value);if(profile.notify&&'Notification'in window){try{let p=await Notification.requestPermission();if(p!=='granted'){profile.notify=false;toast('Notifications non autorisées')}}catch{profile.notify=false;toast('Notifications indisponibles dans ce contexte')}}save('profile',profile);render();notifyCheck()};if(by('export'))by('export').onclick=()=>download('proxy-desk-v2-sauvegarde.json',{schema:2,profile,progress,eventsProgress,feed,meta});if(by('sample'))by('sample').onclick=()=>download('proxy-desk-v2-flux-exemple.json',{schema:2,version:'3.3',verified:'2026-10-21',source:'https://zenless.hoyoverse.com/en-us/news/cate/',events:[{id:'exemple-uniquement',title:'EXEMPLE — remplacer par événement officiel',end:'2026-11-01T02:59:00Z',url:'https://zenless.hoyoverse.com/en-us/news/cate/',rewardPolychromes:0,level:25,spoiler:false}],rotations:[]});if(by('import'))by('import').onclick=()=>by('backupFile').click();if(by('backupFile'))by('backupFile').onchange=()=>fileJSON(by('backupFile').files[0],v=>{if(v.schema!==2||!v.profile||!v.progress)throw Error('Ce n’est pas une sauvegarde V2');profile={...DEFAULT,...v.profile};progress=v.progress;eventsProgress=v.eventsProgress||{};if(v.feed)feed=validate(v.feed);meta=v.meta||meta;save('profile',profile);save('progress',progress);save('eventsProgress',eventsProgress);save('feed',feed);save('meta',meta);render();toast('Sauvegarde restaurée')});if(by('migrate'))by('migrate').onclick=()=>{try{let old=JSON.parse(localStorage.getItem('px_checks')||'{}');let found=0;const maps={'daily-err':'daily-errands','d-club':'video','d-cafe':'coffee','d-battery':'battery','d-scratch':'scratch','d-member':'membership','w-ridu':'ridu','w-hollow':'hollow','w-hunt':'hunts','w-pass':'pass','m-limited':'monthly-limited','m-normal':'monthly-standard'};for(let t of TASKS){let oldid=maps[t.id];if(!oldid)continue;let k=Object.keys(old).find(x=>x.includes(oldid)&&old[x]===true);if(k){progress[t.id+'|'+period(t.group)]=t.goal;found++}}save('progress',progress);render();toast(found+' tâches V1 récupérées (correspondances probables)')}catch(e){toast('Migration impossible : '+e.message)}}}
document.getElementById('refresh').onclick=fetchFeed;render();if(profile.autoRefresh&&profile.feedUrl)fetchFeed();setInterval(()=>{let last=window.periodSignature,now=period('daily')+'|'+period('weekly')+'|'+period('monthly');if(last&&last!==now)render();window.periodSignature=now;notifyCheck()},60000);setInterval(()=>{if(profile.autoRefresh&&profile.feedUrl)fetchFeed()},60*60000);
</script></body></html>

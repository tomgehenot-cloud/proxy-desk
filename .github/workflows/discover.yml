name: Discover official ZZZ announcements
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover_official.py
      - name: Commit detected official announcements
        run: |
          if [ -f feed/discovered.json ]; then
            git add feed/discovered.json
          else
            echo 'No discovery file generated; nothing to publish.'
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update official ZZZ announcement discoveries"
            git push
          fi

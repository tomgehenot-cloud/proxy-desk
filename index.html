<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><title>Proxy Desk V3 — ZZZ</title><style>
:root{color-scheme:dark;--bg:#10151b;--panel:#1c252e;--edge:#34414c;--muted:#aebbc5;--ink:#f5f5ec;--accent:#e6fc82;--red:#ff8d94;--green:#9bdfb0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#1e2b31,#10151b 35%);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}.shell{max-width:1240px;margin:auto;padding:18px}.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}.brand h1{margin:0;font-size:23px;letter-spacing:1px}.brand small,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:195px 1fr;gap:20px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{text-align:left;padding:12px;background:transparent;border:1px solid transparent;border-radius:11px;color:var(--muted)}.nav button.active{background:var(--panel);color:var(--accent);border-color:var(--edge)}main{min-width:0}h2{font-size:26px;margin:0 0 6px}h3{margin:0 0 12px;font-size:17px}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:18px;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.stack{display:grid;gap:8px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.stat{background:var(--panel);border:1px solid var(--edge);padding:16px;border-radius:12px}.stat b{font-size:23px;display:block}.btn{border:1px solid var(--edge);background:#293540;color:var(--ink);border-radius:9px;padding:8px 12px}.btn.primary{background:var(--accent);color:#17201a;border-color:var(--accent);font-weight:700}.btn.mini{padding:5px 9px}.btn.danger{color:var(--red)}.task,.event{border:1px solid var(--edge);border-radius:11px;padding:11px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:#202b35;margin:8px 0}.task.done,.event.done{opacity:.62}.task strong,.event strong{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.controls{display:flex;gap:6px;align-items:center;flex-shrink:0}.tag{display:inline-block;background:#344047;color:#d9e5e4;font-size:11px;padding:3px 7px;border-radius:5px;margin-left:5px}.dangerText{color:var(--red)}.success{color:var(--green)}.mutedTag{color:var(--muted)}.small{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 9px}.sectionhead h3{margin:0}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--edge);border-radius:11px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{width:100%;min-width:0;border-radius:8px;padding:10px;background:#121c23;color:var(--ink);border:1px solid var(--edge)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}details{margin-top:8px}summary{cursor:pointer;color:var(--muted)}label.check{display:inline-flex;gap:7px;align-items:center}.steps{padding:6px 0 0 12px}.step{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #34414c}.step:last-child{border:0}.hidden{display:none!important}.progress{height:5px;background:#34414c;border-radius:6px;overflow:hidden;margin-top:8px}.progress span{display:block;background:var(--accent);height:100%}.notice{border-left:3px solid var(--accent);padding:9px 12px;background:#263138;margin:12px 0}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:var(--accent);color:#17201a}.toast{position:fixed;right:15px;bottom:15px;background:#384750;padding:13px 20px;border:1px solid var(--accent);border-radius:8px;box-shadow:0 5px 30px #0007;max-width:360px}.actionline{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal>.panel{width:min(590px,100%);max-height:92vh;overflow:auto;margin:0}.foot{color:var(--muted);font-size:11px;margin:24px 0}input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}button:disabled{opacity:.35;cursor:not-allowed}@media(max-width:750px){.layout{display:block}.nav{display:flex;flex-direction:row;overflow-x:auto;margin-bottom:14px;position:sticky;top:0;background:#10151bee;padding:6px 0;z-index:4}.nav button{white-space:nowrap;padding:8px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px}.stat b{font-size:19px}.task,.event{flex-wrap:wrap}.controls{margin-left:auto}.grid2{grid-template-columns:1fr}.shell{padding:12px}}</style></head><body><div class="shell"><header class="brand"><div><h1>PROXY DESK <span style="color:var(--accent)">V3</span></h1><small>Zenless Zone Zero · Tableau de bord personnel</small></div><button class="btn mini" onclick="undo()">↶ Annuler</button></header><div class="layout"><nav class="nav" id="nav"></nav><main id="app"></main></div><footer class="foot">Outil non officiel · Données enregistrées localement dans ce navigateur. Export de sauvegarde recommandé. Les routines ne se synchronisent pas entre appareils.</footer></div><div class="toast hidden" id="toast"></div><script>
'use strict';
const DAY=86400000;
// Built-in V2 task catalog and compatibility with px2_* localStorage keys.
const TASKS=[
{id:'d-err',group:'daily',title:'400 points d’activité + réclamer les 60 Polychromes',where:'Compendium → Courses quotidiennes',how:'Atteindre 400 points, puis toucher les récompenses de chaque palier.',goal:1,unit:'réclamation',reward:60,rewardUnit:'Polychromes',priority:1},
{id:'d-club',group:'daily',title:'Vidéoclub : récolter et relancer',where:'Random Play → comptoir',how:'Récupérer les Dennies, choisir les cassettes et relancer l’exploitation.',goal:1,unit:'fois',priority:2},
{id:'d-cafe',group:'daily',title:'Prendre le café',where:'Coff Café',how:'Récupérer le bonus quotidien de batterie avant de dépenser ta batterie.',goal:1,unit:'café',priority:2},
{id:'d-battery',group:'daily',title:'Utiliser la batterie',where:'Compendium → entraînements et défis',how:'Actuellement : matériaux Soldat 0 – Anby, Rina et Nicole. Ne vise pas encore des disques parfaits.',goal:1,unit:'session',priority:2},
{id:'d-scratch',group:'daily',title:'Kiosque : ticket quotidien',where:'Kiosque de Howl',how:'Gratter le ticket et récupérer la récompense du jour.',goal:1,unit:'ticket',priority:3},
{id:'d-member',group:'daily',title:'Abonnement : récupérer 90 Polychromes',where:'Écran de récompense de connexion',how:'Seulement si ton abonnement Inter-nœud est actif. Récompense perdue si tu ne te connectes pas.',goal:1,unit:'jour',reward:90,rewardUnit:'Polychromes',unlock:'member',priority:1},
{id:'w-ridu',group:'weekly',title:'Ridu hebdo : atteindre 2 100 points',where:'Ridu hebdo',how:'Faire les mini-objectifs et réclamer les récompenses. Repères : 800 points (Polychromes), 1 700 (batterie), 2 100 (tous les paliers).',goal:2100,step:50,unit:'points',reward:60,rewardUnit:'Polychromes',unlock:'ridu',priority:1},
{id:'w-hollow',group:'weekly',title:'Néant Zéro : primes hebdomadaires',where:'Néant Zéro → primes',how:'Atteindre et réclamer les paliers hebdomadaires accessibles. À ne pas confondre avec les récompenses permanentes.',goal:1,unit:'lot',unlock:'hollow',priority:1},
{id:'w-hunt',group:'weekly',title:'Chasse notoire : récompenses gratuites',where:'Avant-poste Scott → Chasse notoire',how:'Faire trois récupérations gratuites en batterie. Sélectionner les matériaux réellement utiles.',goal:3,unit:'boss',unlock:'hunt',priority:1},
{id:'w-pass',group:'weekly',title:'Pass : réclamer les missions hebdomadaires',where:'Fonds de la Nouvelle Éridu',how:'Réclamer l’EXP gagnée naturellement ; ne pas forcer des dépenses pour des missions marginales.',goal:1,unit:'lot',priority:3},
{id:'w-zmerit',group:'weekly',title:'Mérites-Z : obtenir 1 900 par semaine',where:'Néant Zéro → récompenses',how:'Accumuler jusqu’à 1 900 Mérites-Z chaque semaine grâce aux activités du Néant Zéro. Saisir le total gagné cette semaine avec les boutons ±50 ; ne pas confondre avec le solde actuel.',goal:1900,step:50,unit:'Mérites-Z',unlock:'hollow',priority:3},
{id:'m-limited',group:'monthly',title:'Bandes chiffrées mensuelles',where:'Boutique des signaux → signaux affaiblis',how:'Acheter jusqu’à 5 bandes limitées, à 90 signaux affaiblis chacune.',goal:5,unit:'bandes',priority:1},
{id:'m-normal',group:'monthly',title:'Bandes ordinaires mensuelles',where:'Boutique des signaux → signaux affaiblis',how:'Acheter jusqu’à 5 bandes permanentes si le stock de signaux le permet.',goal:5,unit:'bandes',priority:2},
{id:'m-zmerit',group:'monthly',title:'Avant-poste : stocks mensuels',where:'Avant-poste Scott → Logistique',how:'Examiner les récompenses renouvelables et dépenser les Mérites Z sur ce qui t’intéresse.',goal:1,unit:'contrôle',unlock:'hollow',priority:2},
{id:'m-bang',group:'monthly',title:'Boutique Bangbou : contrôler le stock',where:'Boutique des signaux → Bangbou',how:'Acheter les matériaux renouvelables si utiles.',goal:1,unit:'contrôle',unlock:'bangboo',priority:3,optional:true},
{id:'m-assoc',group:'monthly',title:'Fournitures de l’association',where:'Boutique de l’association',how:'Vérifier les objets renouvelables achetables avec la devise dédiée.',goal:1,unit:'contrôle',priority:3,optional:true},
{id:'r-shiyu',group:'rotations',title:'Défense de Shiyu — Nœud critique',where:'Défense de Shiyu → Nœud critique',how:'Faire les niveaux accessibles et réclamer les récompenses avant le changement de cycle.',goal:1,unit:'rotation',unlock:'shiyu',priority:2},
{id:'r-assault',group:'rotations',title:'Assaut mortel — Épreuve',where:'Assaut mortel → Épreuve',how:'Obtenir les étoiles possibles et récupérer les récompenses avant la rotation.',goal:1,unit:'rotation',unlock:'assault',priority:2},
{id:'r-simul',group:'rotations',title:'Simulacre d’annihilation',where:'Menu du mode dédié',how:'Vérifier le renouvellement de version ; personnages d’essai disponibles selon le défi.',goal:1,unit:'rotation',unlock:'simul',priority:3}
];

const DEFAULT={level:30,member:false,hideOptional:true,unlocked:{ridu:true,hollow:false,hunt:false,bangboo:true,shiyu:false,assault:false,simul:false},disabled:[],rotationDates:{shiyu:'',assault:'',simul:''}};
const read=(key,f)=>{try{return JSON.parse(localStorage.getItem(key))??f}catch{return f}};
const put=(key,obj)=>localStorage.setItem(key,JSON.stringify(obj));
let profile={...DEFAULT,...read('px2_profile',{})};profile.unlocked={...DEFAULT.unlocked,...profile.unlocked};profile.rotationDates={...DEFAULT.rotationDates,...profile.rotationDates};
let progress=read('px2_progress',{}),evs=read('px3_events',[]),ui=read('px3_ui',{archivedRoutines:[],snoozes:{}}),rotations=read('px3_rotations',{});
let page='home',editId=null,filter='all',undoState=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const atDay=s=>s?new Date(s+'T23:59:59+01:00').getTime():null;
const startDay=s=>s?new Date(s+'T04:00:00+01:00').getTime():null;
const stamp=t=>!t?'Date inconnue':Math.ceil((t-now())/DAY)<=0?'Expire aujourd’hui':'J−'+Math.ceil((t-now())/DAY);
// Europe server reset is 04:00 UTC+1 year-round (03:00Z).
function period(group,at=now()){let d=new Date(at-3*3600000),y=d.getUTCFullYear(),m=d.getUTCMonth(),day=d.getUTCDate(),dow=d.getUTCDay();if(group==='daily')return d.toISOString().slice(0,10);if(group==='weekly')return new Date(Date.UTC(y,m,day-(dow+6)%7)).toISOString().slice(0,10);if(group==='monthly')return d.toISOString().slice(0,7);return 'manual'}
function reset(group){let d=new Date(now()-3*3600000),y=d.getUTCFullYear(),m=d.getUTCMonth(),day=d.getUTCDate(),w=d.getUTCDay();if(group==='daily')return Date.UTC(y,m,day+1,3);if(group==='weekly')return Date.UTC(y,m,day+((8-w)%7||7),3);return Date.UTC(y,m+1,1,3)}
function dateShort(t){return t?new Intl.DateTimeFormat('fr-BE',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Brussels'}).format(t):'Non renseignée'}
function target(t){return t.group==='rotations'?rotations[t.id]||profile.rotationDates[t.id.replace('r-','')]||'non-renseignée':period(t.group)}
function value(t){return Math.max(0,Math.min(t.goal,Number(progress[t.id+'|'+target(t)]||0)))}
function taskVisible(t){return (t.unlock==='member'?profile.member:!t.unlock||profile.unlocked[t.unlock])&&!profile.disabled.includes(t.id)&&(!t.optional||!profile.hideOptional)}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.classList.remove('hidden');clearTimeout(window.toaster);window.toaster=setTimeout(()=>x.classList.add('hidden'),3500)}
function store(){put('px2_profile',profile);put('px2_progress',progress);put('px3_events',evs);put('px3_ui',ui);put('px3_rotations',rotations)}
function snapshot(){return JSON.parse(JSON.stringify({profile,progress,evs,ui,rotations}))}
function remember(){undoState=snapshot()}
function undo(){if(!undoState)return;({profile,progress,evs,ui,rotations}=undoState);undoState=null;store();render();toast('Modification annulée')}
function setValue(id,d){let t=TASKS.find(t=>t.id===id);if(!t)return;remember();let k=t.id+'|'+target(t);progress[k]=Math.max(0,Math.min(t.goal,value(t)+d));store();render()}
function eventStatus(e){if(e.archived)return 'archived';if(e.type==='temporary'&&e.end&&atDay(e.end)<now())return 'expired';if(isComplete(e))return 'completed';if(e.start&&startDay(e.start)>now())return 'upcoming';if(e.locked)return 'locked';if(e.paused)return 'paused';if(e.mode==='steps'&&e.steps.length&&e.steps.every(x=>x.done||!stepOpen(x)))return 'uptodate';return 'available'}
function stepOpen(s){return !s.locked&&(!s.start||startDay(s.start)<=now())}
function isComplete(e){if(e.mode==='check')return !!e.done;if(e.mode==='counter')return Number(e.count)>=Number(e.goal);if(e.mode==='steps')return e.steps.length>0&&e.steps.every(s=>s.done);return false}
function statusLabel(s){return ({archived:'Archivé',expired:'Expiré',completed:'Terminé',upcoming:'À venir',locked:'À débloquer',paused:'En pause',uptodate:'À jour',available:'Disponible'})[s]||s}
function availableEvents(){return evs.filter(e=>eventStatus(e)==='available').sort((a,b)=>(atDay(a.end)||Infinity)-(atDay(b.end)||Infinity))}
function waitingEvents(){return evs.filter(e=>['upcoming','locked','paused','uptodate'].includes(eventStatus(e)))}
function archivals(){return evs.filter(e=>['archived','expired','completed'].includes(eventStatus(e)))}
function eventCounter(e){if(e.mode==='check')return e.done?'1/1':'0/1';if(e.mode==='counter')return `${e.count}/${e.goal}`;return `${e.steps.filter(s=>s.done).length}/${e.steps.length} étapes`}
function taskCard(t){let v=value(t),done=v>=t.goal;return `<div class="task ${done?'done':''}"><div><strong>${esc(t.title)}</strong><div class="meta">${esc(t.where)} · ${v}/${t.goal} ${esc(t.unit||'')}</div><details><summary>Comment faire</summary><div class="small">${esc(t.how)}</div></details></div><div class="controls"><button class="btn mini" data-dec="${t.id}" ${v===0?'disabled':''}>−</button><button class="btn mini ${done?'':'primary'}" data-inc="${t.id}" ${done?'disabled':''}>${t.goal===1?'✓':'+'}</button></div></div>`}
function eUrgent(e){return e.end&&atDay(e.end)-now()<2*DAY&&atDay(e.end)>=now()}
function eventCard(e,compact=false){let st=eventStatus(e);let s=`<div class="event" data-id="${esc(e.id)}"><div style="flex:1;min-width:180px"><div><strong>${esc(e.name)}</strong> <span class="tag">${statusLabel(st)}</span> ${eUrgent(e)?'<span class="tag dangerText">Urgent</span>':''}</div><div class="meta">${eventCounter(e)}${e.end?' · '+stamp(atDay(e.end)):''}${e.type==='permanent'?' · Permanent':''}</div>`;
if(e.mode==='steps'&&!compact){s+='<div class="steps">'+e.steps.map((step,i)=>`<div class="step"><label class="check"><input type="checkbox" data-step="${esc(e.id)}" data-n="${i}" ${step.done?'checked':''} ${!stepOpen(step)||st==='expired'?'disabled':''}> ${esc(step.label)}</label><span class="small">${!stepOpen(step)?'À venir / verrouillé':''}</span></div>`).join('')+'</div>'}
s+=`<div class="actionline"><button class="btn mini" data-edit="${esc(e.id)}">Modifier</button>${st==='available'&&e.mode==='check'?`<button class="btn mini primary" data-eventdone="${esc(e.id)}">✓ Terminer</button>`:''}${st==='available'&&e.mode==='counter'?`<button class="btn mini" data-count="${esc(e.id)}" data-delta="-1">−</button><button class="btn mini primary" data-count="${esc(e.id)}" data-delta="1">+</button>`:''}${st==='locked'?`<button class="btn mini primary" data-unlock="${esc(e.id)}">Débloqué !</button>`:''}${st==='uptodate'?'<span class="small">En attente de prochaines étapes</span>':''}${!compact?`<button class="btn mini" data-duplicate="${esc(e.id)}">Dupliquer</button>`:''}</div></div></div>`;return s}
function home(){let openTasks=TASKS.filter(t=>taskVisible(t)&&value(t)<t.goal&&(t.group!=='rotations'||(rotations[t.id]||profile.rotationDates[t.id.replace('r-','')])));let todayTasks=openTasks.filter(t=>t.group==='daily'),otherTasks=openTasks.filter(t=>t.group!=='daily');let es=availableEvents();let urgent=es.filter(e=>eUrgent(e));let dAll=TASKS.filter(t=>t.group==='daily'&&taskVisible(t)),dDone=dAll.filter(t=>value(t)>=t.goal).length;return `<div class="row wrap"><div><div class="small">TON QG · ${new Intl.DateTimeFormat('fr-BE',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Brussels'}).format(new Date())}</div><h2>Aujourd'hui</h2><div class="small">Seulement les actions qui restent à faire.</div></div><button class="btn" data-page="events">+ Événement</button></div><div class="cards"><div class="stat"><span class="small">Quotidien</span><b>${dDone}/${dAll.length}</b></div><div class="stat"><span class="small">À faire</span><b>${openTasks.length+es.length}</b></div><div class="stat"><span class="small">Urgences</span><b>${urgent.length+otherTasks.filter(t=>reset(t.group)-now()<2*DAY).length}</b></div></div>${urgent.length?`<section class="panel"><h3 class="dangerText">⚠ Échéances proches</h3>${urgent.map(e=>eventCard(e,true)).join('')}</section>`:''}${todayTasks.length?`<section class="panel"><h3>Quotidien · ${todayTasks.length} restantes</h3>${todayTasks.map(taskCard).join('')}</section>`:''}${otherTasks.length?`<section class="panel"><h3>Cette semaine, ce mois et rotations</h3>${otherTasks.sort((a,b)=>(reset(a.group)||Infinity)-(reset(b.group)||Infinity)).map(taskCard).join('')}</section>`:''}${es.length?`<section class="panel"><h3>Événements à faire · ${es.length}</h3>${es.filter(e=>!urgent.includes(e)).map(e=>eventCard(e,true)).join('')}${urgent.length?'<p class="small">Les événements urgents sont affichés au-dessus.</p>':''}</section>`:''}${!todayTasks.length&&!otherTasks.length&&!es.length?'<div class="panel empty"><h3>✓ Tout est à jour !</h3>Aucune activité accessible ne demande d’action pour le moment.</div>':''}<section class="panel"><details><summary>En attente · ${waitingEvents().length}</summary>${waitingEvents().map(e=>eventCard(e,true)).join('')||'<p class="small">Aucun événement en attente.</p>'}</details><details><summary>Routines terminées pour leur période · ${TASKS.filter(t=>taskVisible(t)&&value(t)>=t.goal).length}</summary>${TASKS.filter(t=>taskVisible(t)&&value(t)>=t.goal).map(taskCard).join('')}</details></section><div class="small">Prochain reset quotidien : ${dateShort(reset('daily'))} · Hebdomadaire : ${dateShort(reset('weekly'))}</div>`}
function routinePage(){let gr=['daily','weekly','monthly','rotations'];return `<h2>Routines</h2><p class="muted">Suivi renouvelable · les tâches terminées restent consultables ici.</p>${gr.map(g=>`<section class="panel"><div class="row"><h3>${({daily:'Tous les jours',weekly:'Chaque semaine',monthly:'Chaque mois',rotations:'Rotations'})[g]}</h3><span class="small">${g!=='rotations'?'Reset : '+dateShort(reset(g)):'Dates configurables'}</span></div>${TASKS.filter(t=>t.group===g&&taskVisible(t)).map(taskCard).join('')||'<p class="small">Rien de débloqué.</p>'}</section>`).join('')}`}
function eventsPage(){let wait=waitingEvents(),active=availableEvents();return `<div class="row wrap"><div><h2>Événements</h2><p class="muted">Uniquement ce qui est actif ou en attente. Les archives sont ailleurs.</p></div><button class="btn primary" id="addEvent">+ Ajouter</button></div><section class="panel"><h3>À faire maintenant · ${active.length}</h3>${active.map(e=>eventCard(e)).join('')||'<div class="empty">Aucun événement disponible à faire.</div>'}</section><section class="panel"><h3>En attente · ${wait.length}</h3>${wait.map(e=>eventCard(e)).join('')||'<div class="empty">Aucun événement en attente.</div>'}</section>`}
function archivePage(){let arr=archivals().filter(e=>filter==='all'||eventStatus(e)===filter);return `<div class="row"><div><h2>Archives</h2><p class="muted">Terminés, expirés ou archivés volontairement, hors de l'accueil.</p></div></div><div class="tabs">${['all','completed','expired','archived'].map(x=>`<button class="btn mini ${filter===x?'active':''}" data-filter="${x}">${({all:'Tous',completed:'Terminés',expired:'Expirés',archived:'Archivés'})[x]}</button>`).join('')}</div><section class="panel">${arr.map(e=>`<div class="event"><div><strong>${esc(e.name)}</strong> <span class="tag">${statusLabel(eventStatus(e))}</span><div class="small">${eventCounter(e)} ${e.finishedAt?'· Fini le '+esc(e.finishedAt):''}</div></div><div class="controls"><button class="btn mini" data-edit="${esc(e.id)}">Voir / modifier</button><button class="btn mini" data-restore="${esc(e.id)}">Restaurer</button></div></div>`).join('')||'<div class="empty">Archives vides.</div>'}</section>`}
function profilePage(){return `<h2>Réglages</h2><p class="muted">Les changements sont enregistrés dans ce navigateur.</p><section class="panel"><h3>Déblocages et préférences</h3><div class="field">Niveau Inter-nœud <input type="number" id="level" min="1" max="90" value="${profile.level}"></div><label class="check"><input type="checkbox" id="member" ${profile.member?'checked':''}> Abonnement Inter-nœud actif</label><p><label class="check"><input type="checkbox" id="optional" ${profile.hideOptional?'checked':''}> Masquer les routines facultatives</label></p><div class="grid2">${Object.entries({ridu:'Ridu hebdo',hollow:'Néant Zéro',hunt:'Chasse notoire',bangboo:'Bangbous',shiyu:'Shiyu critique',assault:'Assaut mortel',simul:'Simulacre'}).map(([k,v])=>`<label class="check"><input type="checkbox" data-unlock="${k}" ${profile.unlocked[k]?'checked':''}> ${v}</label>`).join('')}</div><button class="btn primary" id="saveProfile">Enregistrer</button></section><section class="panel"><h3>Routines ignorées</h3><div class="grid2">${TASKS.map(t=>`<label class="check"><input type="checkbox" data-ignore="${t.id}" ${profile.disabled.includes(t.id)?'checked':''}> ${esc(t.title)}</label>`).join('')}</div><button class="btn" id="saveIgnore">Enregistrer les exclusions</button></section><section class="panel"><h3>Prochaines rotations (fin indiquée dans le jeu)</h3>${TASKS.filter(t=>t.group==='rotations').map(t=>`<div class="field">${esc(t.title)}<input type="datetime-local" data-date="${t.id}" value="${esc(rotations[t.id]||'')}"></div>`).join('')}<button class="btn" id="saveRot">Enregistrer les dates</button></section><section class="panel"><h3>Sauvegarde et sécurité</h3><p class="muted">Tes données sont locales à ce navigateur. Une mise à jour du site ne les efface normalement pas, mais un autre appareil ne les aura pas.</p><div class="actionline"><button class="btn primary" id="export">Exporter la sauvegarde V3</button><button class="btn" id="import">Importer une sauvegarde</button><input type="file" id="importFile" accept="application/json" class="hidden"><button class="btn" id="undo">Annuler dernière action</button></div></section>`}
function form(e){let isNew=!e;e=e||{id:'',name:'',type:'temporary',start:'',end:'',mode:'check',done:false,count:0,goal:5,steps:[],locked:false,paused:false,archived:false};let options=`<div class="field">Nom<input id="evName" maxlength="140" value="${esc(e.name)}" required></div><div class="grid2"><div class="field">Type<select id="evType"><option value="temporary" ${e.type==='temporary'?'selected':''}>Temporaire</option><option value="permanent" ${e.type==='permanent'?'selected':''}>Permanent</option><option value="mixed" ${e.type==='mixed'?'selected':''}>Permanent avec période limitée</option></select></div><div class="field">Suivi<select id="evMode"><option value="check" ${e.mode==='check'?'selected':''}>Simple case</option><option value="counter" ${e.mode==='counter'?'selected':''}>Compteur</option><option value="steps" ${e.mode==='steps'?'selected':''}>Étapes</option></select></div></div><div class="grid2"><div class="field">Disponible à partir du<input type="date" id="evStart" value="${esc(e.start||'')}"></div><div class="field">Date de fin (facultative)<input type="date" id="evEnd" value="${esc(e.end||'')}"></div></div><div id="modeFields"><div class="grid2"><div class="field">Compteur actuel<input type="number" id="evCount" min="0" value="${Number(e.count||0)}"></div><div class="field">Objectif<input type="number" id="evGoal" min="1" value="${Number(e.goal||5)}"></div></div><div class="field">Étapes (une par ligne ; date facultative après |, ex. Mission 1 | 2026-10-25)<textarea id="evSteps" rows="5" placeholder="Étape 1&#10;Étape 2 | 2026-11-01">${esc((e.steps||[]).map(s=>s.label+(s.start?' | '+s.start:'')).join('\n'))}</textarea></div></div><p><label class="check"><input type="checkbox" id="evLocked" ${e.locked?'checked':''}> À débloquer sur mon compte</label></p><details><summary>Options supplémentaires</summary><p><label class="check"><input type="checkbox" id="evPaused" ${e.paused?'checked':''}> Mettre en pause</label></p><p><label class="check"><input type="checkbox" id="evArchived" ${e.archived?'checked':''}> Archiver manuellement</label></p></details>`;
return `<div class="modal" id="modal"><div class="panel"><div class="row"><h3>${isNew?'Ajouter un événement':'Modifier un événement'}</h3><button class="btn mini" id="closeModal">✕</button></div>${options}<div class="actionline"><button class="btn primary" id="saveEvent">Enregistrer</button>${!isNew?`<button class="btn danger" id="deleteEvent">Supprimer</button>`:''}<button class="btn" id="cancelEvent">Annuler</button></div><p class="small">Les étapes déjà cochées seront conservées si leur nom reste identique.</p></div></div>`}
function openEditor(id=null){editId=id;document.body.insertAdjacentHTML('beforeend',form(evs.find(e=>e.id===id)));document.getElementById('closeModal').onclick=closeEditor;document.getElementById('cancelEvent').onclick=closeEditor;document.getElementById('saveEvent').onclick=saveEvent;document.getElementById('evMode').onchange=modeFields;modeFields();if(id)document.getElementById('deleteEvent').onclick=()=>{if(confirm('Supprimer définitivement cet événement ?')){remember();evs=evs.filter(e=>e.id!==id);store();closeEditor();render()}}}
function closeEditor(){document.getElementById('modal')?.remove()}
function modeFields(){const m=document.getElementById('evMode').value;document.getElementById('evCount').parentElement.parentElement.style.display=m==='counter'?'grid':'none';document.getElementById('evSteps').parentElement.style.display=m==='steps'?'grid':'none'}
function saveEvent(){let old=evs.find(e=>e.id===editId),name=document.getElementById('evName').value.trim(),type=document.getElementById('evType').value,mode=document.getElementById('evMode').value,start=document.getElementById('evStart').value,end=document.getElementById('evEnd').value,goal=Math.max(1,Number(document.getElementById('evGoal').value||1)),count=Math.max(0,Number(document.getElementById('evCount').value||0));if(!name){toast('Un nom est nécessaire');return}if(start&&end&&start>end){toast('Date de fin antérieure au début');return}let stages=document.getElementById('evSteps').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,100).map(s=>{let parts=s.split('|'),label=parts[0].trim(),d=(parts[1]||'').trim(),prev=old?.steps?.find(x=>x.label===label);return {label,start:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:'',locked:prev?.locked||false,done:prev?.done||false}});remember();let e={id:old?.id||'user-'+(crypto.randomUUID?crypto.randomUUID():Date.now()),name,type,start,end:type==='permanent'?'':end,mode,goal,count:Math.min(goal,count),done:old?.done||false,steps:stages,locked:document.getElementById('evLocked').checked,paused:document.getElementById('evPaused').checked,archived:document.getElementById('evArchived').checked,finishedAt:old?.finishedAt||null};if(mode==='check'&&old?.mode!=='check')e.done=false;if(mode==='steps'&&!stages.length){toast('Ajoute au moins une étape');return}if(isComplete(e)&&!e.finishedAt)e.finishedAt=new Date().toISOString().slice(0,10);if(!isComplete(e))e.finishedAt=null;if(old)evs=evs.map(x=>x.id===old.id?e:x);else evs.push(e);store();closeEditor();render();toast('Événement sauvegardé')}
function eventAction(id,op,n){let e=evs.find(e=>e.id===id);if(!e)return;remember();if(op==='done')e.done=!e.done;if(op==='count')e.count=Math.min(e.goal,Math.max(0,e.count+n));if(op==='step'){let s=e.steps[n];if(s&&stepOpen(s))s.done=!s.done}if(op==='unlock')e.locked=false;if(op==='restore'){e.archived=false;e.done=false;e.count=0;e.finishedAt=null;if(e.mode==='steps')e.steps.forEach(x=>x.done=false)}if(isComplete(e)&&!e.finishedAt)e.finishedAt=new Date().toISOString().slice(0,10);if(!isComplete(e))e.finishedAt=null;store();render()}
function duplicate(id){let e=evs.find(e=>e.id===id);if(!e)return;remember();let c=structuredClone(e);c.id='user-'+crypto.randomUUID();c.name=e.name+' (copie)';c.start='';c.end='';c.done=false;c.count=0;c.finishedAt=null;c.archived=false;c.paused=false;c.steps.forEach(x=>{x.done=false;x.start='' });evs.push(c);store();render();openEditor(c.id)}
function download(obj){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=u;a.download='proxy-desk-v3-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function render(){let pages=[['home',"Aujourd'hui"],['routines','Routines'],['events','Événements'],['archives','Archives'],['settings','Réglages']];document.getElementById('nav').innerHTML=pages.map(([p,t])=>`<button data-page="${p}" class="${p===page?'active':''}">${t}</button>`).join('');document.getElementById('app').innerHTML=page==='home'?home():page==='routines'?routinePage():page==='events'?eventsPage():page==='archives'?archivePage():profilePage();bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)});document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>setValue(b.dataset.inc,1*(TASKS.find(t=>t.id===b.dataset.inc)?.step||1)));document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>setValue(b.dataset.dec,-1*(TASKS.find(t=>t.id===b.dataset.dec)?.step||1)));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-eventdone]').forEach(b=>b.onclick=()=>eventAction(b.dataset.eventdone,'done'));document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>eventAction(b.dataset.count,'count',Number(b.dataset.delta)));document.querySelectorAll('[data-step]').forEach(b=>b.onchange=()=>eventAction(b.dataset.step,'step',Number(b.dataset.n)));document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>eventAction(b.dataset.unlock,'unlock'));document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>eventAction(b.dataset.restore,'restore'));document.querySelectorAll('[data-duplicate]').forEach(b=>b.onclick=()=>duplicate(b.dataset.duplicate));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if(document.getElementById('addEvent'))document.getElementById('addEvent').onclick=()=>openEditor();if(document.getElementById('saveProfile'))document.getElementById('saveProfile').onclick=()=>{profile.level=Number(document.getElementById('level').value)||30;profile.member=document.getElementById('member').checked;profile.hideOptional=document.getElementById('optional').checked;document.querySelectorAll('[data-unlock]').forEach(x=>profile.unlocked[x.dataset.unlock]=x.checked);store();render();toast('Profil sauvegardé')};if(document.getElementById('saveIgnore'))document.getElementById('saveIgnore').onclick=()=>{profile.disabled=[...document.querySelectorAll('[data-ignore]:checked')].map(x=>x.dataset.ignore);store();render()};if(document.getElementById('saveRot'))document.getElementById('saveRot').onclick=()=>{document.querySelectorAll('[data-date]').forEach(x=>rotations[x.dataset.date]=x.value);store();render();toast('Rotations enregistrées')};if(document.getElementById('export'))document.getElementById('export').onclick=()=>download({schema:3,savedAt:new Date().toISOString(),...snapshot()});if(document.getElementById('import'))document.getElementById('import').onclick=()=>document.getElementById('importFile').click();if(document.getElementById('undo'))document.getElementById('undo').onclick=undo;if(document.getElementById('importFile'))document.getElementById('importFile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(![2,3].includes(obj.schema)||!obj.profile||!obj.progress)throw Error('Format de sauvegarde invalide');if(!confirm('Importer la sauvegarde ? Cela remplacera tes données actuelles. Exporte une copie avant de continuer.'))return;remember();profile={...DEFAULT,...obj.profile};profile.unlocked={...DEFAULT.unlocked,...profile.unlocked};progress=obj.progress;evs=obj.schema===3&&Array.isArray(obj.evs)?obj.evs:evs;ui=obj.schema===3&&obj.ui?obj.ui:ui;rotations=obj.schema===3&&obj.rotations?obj.rotations:rotations;store();render();toast('Sauvegarde importée')}catch(err){toast(err.message)}}}
render();setInterval(()=>{let sig=period('daily')+'|'+period('weekly')+'|'+period('monthly');if(window.sig&&sig!==window.sig)render();window.sig=sig},30000);
</script></body></html>
